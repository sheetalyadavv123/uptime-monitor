# Settings for pytest (the test runner).
[pytest]
# Let us write `async def test_...` functions without extra decorators.
asyncio_mode = auto
# Use ONE event loop for the whole test run. The database connection pool
# lives as long as the process, so it must not be tied to a short-lived loop.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
# Hide a harmless warning from a library we do not control.
filterwarnings =
    ignore::DeprecationWarning
