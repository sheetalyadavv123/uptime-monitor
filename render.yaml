# Render Blueprint: one Docker web service + one PostgreSQL database.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
# No secrets live here: SECRET_KEY is generated by Render, and DATABASE_URL
# is wired in from the managed database.
services:
  - type: web
    name: uptime-monitor
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: uptime-db
          property: connectionString

databases:
  - name: uptime-db
    plan: free
    region: oregon
    databaseName: uptime
    user: uptime
    ipAllowList: []   # internal access only, not reachable from the internet
